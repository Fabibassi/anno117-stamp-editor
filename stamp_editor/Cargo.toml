[package]
name = "stamp_editor"
version = "0.2.4"
edition = "2021"
description = "Anno 117 stamp editor with coverage and production-chain tools"
license = "MIT"

[profile.release]
strip = true

[dependencies]
base64 = "0.22"
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["dds", "png"] }
image_dds = "0.7"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

